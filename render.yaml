services:
  - type: web
    name: stockflow
    runtime: node
    plan: free
    buildCommand: npm --prefix backend install && npm --prefix frontend install && npm --prefix frontend run build
    startCommand: node backend/server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stockflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
databases:
  - name: stockflow-db
    plan: free
    databaseName: stockflow
    user: stockflow
